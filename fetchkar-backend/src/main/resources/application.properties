spring.application.name=fetchkar-backend
server.port=8081
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ==========================================
# DATABASE (SUPABASE POSTGRES)
# ==========================================
# TODO: Replace with your Supabase Transaction Pooler URL (e.g. jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres)
spring.datasource.url=jdbc:postgresql://YOUR_SUPABASE_URL_HERE
spring.datasource.username=postgres.YOUR_PROJECT_ID
spring.datasource.password=YOUR_DATABASE_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true

# ==========================================
# STORAGE (CLOUDFLARE R2 / S3)
# ==========================================
# TODO: Replace with your Cloudflare R2 Credentials
cloudflare.r2.endpoint=https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com
cloudflare.r2.access-key=YOUR_ACCESS_KEY
cloudflare.r2.secret-key=YOUR_SECRET_KEY
cloudflare.r2.bucket=clientping-uploads

# ==========================================
# AUTH (JWT)
# ==========================================
jwt.secret=94a08da1fecbb6e8b46990538c7b50b2a8d3e2307b22a08ab9e5c46e30b65401
jwt.expiration=86400000
